name: annomate-mac
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # The standard macOS onnxruntime wheel includes the CoreML execution provider.
      - onnxruntime==1.23.2
      - huggingface_hub
      - PySide6>=6.11.0
      - opencv-python
      - numpy>=1.24.0
      - scipy>=1.10.0
      - matplotlib>=3.7.0
      - pillow>=10.0.0
      - pyinstaller
      - ruff
