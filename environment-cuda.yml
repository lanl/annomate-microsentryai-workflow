name: annomate-cuda
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # CUDA execution provider. The nvidia pip packages below are a DEV
      # convenience so CUDA works without a system CUDA install; the shipped
      # GPU build does NOT bundle them — end users need system CUDA 12 +
      # cuDNN 9 (or use the DirectML build on Windows, which needs nothing).
      - onnxruntime-gpu==1.23.2
      - nvidia-cudnn-cu12
      - nvidia-cublas-cu12
      - nvidia-cuda-nvrtc-cu12
      - huggingface_hub
      - PySide6>=6.11.0
      - opencv-python
      - numpy>=1.24.0
      - scipy>=1.10.0
      - matplotlib>=3.7.0
      - pillow>=10.0.0
      - pyinstaller
      - ruff
